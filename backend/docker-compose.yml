services:
  db:
    image: postgres:17-alpine
    container_name: ngpos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ngpos
      POSTGRES_PASSWORD: ngpos
      POSTGRES_DB: ngpos
    ports:
      # 5433 on the host: a native PostgreSQL install already holds 5432.
      - '5433:5432'
    volumes:
      - ngpos-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ngpos -d ngpos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ngpos-data:
