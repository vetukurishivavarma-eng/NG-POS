# Render blueprint for the NG POS API.
#
# Render's "New > Blueprint" reads this file and provisions the service, so the
# build and start commands below are the source of truth rather than settings
# typed into a form and forgotten.
#
# No database is declared here on purpose. Render's free Postgres is deleted
# after ~30 days; the database lives on Neon instead, and its two connection
# strings are pasted in as environment variables.
services:
  - type: web
    name: ngpos-api
    runtime: node
    plan: free
    # Frankfurt is Render's closest region to Zambia (~150-200ms). Oregon and
    # Ohio are roughly twice that.
    region: frankfurt
    rootDir: backend
    # --include=dev is load-bearing: NODE_ENV=production below makes `npm ci`
    # skip devDependencies, and both the TypeScript compiler and the Prisma CLI
    # live there. Without it the build has no `tsc` and dies on `npm run build`.
    # Render does not prune afterwards, so the Prisma CLI is still present for
    # the `migrate deploy` in startCommand.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations run at start, not at build: Render's build step has no
    # guarantee of database reachability, and `migrate deploy` is a no-op when
    # there is nothing new to apply.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pooled Neon URL (hostname contains "-pooler"), used for queries.
      - key: DATABASE_URL
        sync: false
      # Direct Neon URL, used by `prisma migrate` only. See schema.prisma.
      - key: DIRECT_URL
        sync: false
      # Must be 32+ characters or the process refuses to boot (src/env.ts).
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      # Native clients send no Origin header, so this only constrains browsers.
      - key: CORS_ORIGINS
        value: "*"
      # Reporting days are cut in the shops' timezone, not the container's UTC.
      - key: REPORT_TIMEZONE
        value: Africa/Lusaka
      - key: MAX_CASHIER_DISCOUNT_PERCENT
        value: "10"
      # Forgotten passwords. Reset codes are mailed to ONE administrator, never
      # to the address that asked — shop staff have internal addresses no mailbox
      # answers. Leave PASSWORD_RESET_NOTIFY_EMAIL empty to keep the feature off;
      # the endpoint then says so instead of accepting requests nobody reads.
      - key: PASSWORD_RESET_NOTIFY_EMAIL
        sync: false
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: APP_NAME
        value: NG POS
      # Mail leaves over Resend's HTTPS API, not SMTP. This plan blocks outbound
      # traffic to ports 25, 465 and 587 (all regions, since Sept 2025), and it
      # blocks them by dropping packets — so nodemailer does not fail, it hangs
      # until its socket times out. Upgrading to any paid instance would unblock
      # 465 and 587; port 25 stays blocked everywhere because Render is on EC2.
      - key: RESEND_API_KEY
        sync: false
      # Must be onboarding@resend.dev until a sending domain is verified, and
      # until then Resend only delivers to the account owner's own address.
      - key: MAIL_FROM
        sync: false
      # SMTP is the fallback transport, used only when RESEND_API_KEY is unset —
      # local development, or a host that allows outbound mail. Gmail needs an
      # App Password here, not the account password.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # NOTE: on the free plan the service sleeps after ~15 minutes idle, and a
      # sleeping container runs no cron — so the 00:20 seal in
      # src/jobs/dailyReport.ts will not fire on schedule. catchUpOnBoot() only
      # recovers *yesterday*, so a weekend of sleep leaves older days unsealed.
      # Fine for testing; move to a paid instance before real till data exists.
      - key: CRON_ENABLED
        value: "true"
