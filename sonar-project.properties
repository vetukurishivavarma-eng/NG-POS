# SonarCloud configuration for NG POS (monorepo: backend + mobile).
#
# The projectKey and organization must match what SonarCloud shows after you
# import the repo (Analysis Method: GitHub Actions). SonarCloud's default keys
# for an imported repo are "<github-owner>_<repo>" and "<github-owner>", which
# is what these are set to — change them only if you renamed them in the UI.
sonar.projectKey=vetukurishivavarma-eng_NG-POS
sonar.organization=vetukurishivavarma-eng
sonar.projectName=NG POS

# Analyse the code we actually wrote; leave generated and vendored trees out.
sonar.sources=backend/src,mobile/src,mobile/app
sonar.tests=backend/test

# Everything below is either third-party, generated, or a build artefact, and
# would drown the real findings in noise (and inflate the line count).
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/build/**,\
  mobile/android/**,\
  mobile/ios/**,\
  mobile/.expo/**,\
  **/*.config.js,\
  **/*.config.ts,\
  backend/prisma/migrations/**

# Test files are analysed as tests, not shipped code, so keep them out of the
# main source set's duplication/coverage math.
sonar.test.inclusions=backend/test/**/*.test.ts

# Coverage. Only the backend has a suite; the mobile app has none yet, so it is
# analysed statically only. Path is relative to this file's directory, so the
# backend report has to be reported at repo root.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
